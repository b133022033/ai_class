<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極簡風格待辦清單 TaskFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 3px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }

        /* Checkbox custom animation */
        .task-checkbox:checked + div {
            text-decoration: line-through;
            opacity: 0.6;
        }

        /* Card enter animation */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-slide-in {
            animation: slideIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Smooth transitions */
        .transition-all-200 {
            transition: all 0.2s ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-300 pb-12">

    <div class="max-w-4xl mx-auto px-4 pt-8 md:pt-12">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <div>
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center text-white shadow-lg shadow-sky-500/30">
                        <i class="fa-solid fa-check-double text-xl"></i>
                    </div>
                    <h1 class="text-3xl font-bold tracking-tight bg-gradient-to-r from-slate-900 to-slate-700 dark:from-white dark:to-slate-300 bg-clip-text text-transparent">
                        TaskFlow 清單
                    </h1>
                </div>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1" id="currentDateText">
                    載入日期中...
                </p>
            </div>

            <!-- Action Tools & Theme Switcher -->
            <div class="flex items-center gap-2 self-end md:self-auto">
                <button id="exportBtn" title="匯出資料" class="p-2.5 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-800 rounded-xl transition-colors">
                    <i class="fa-solid fa-download"></i>
                </button>
                <button id="importBtn" title="匯入資料" class="p-2.5 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-800 rounded-xl transition-colors">
                    <i class="fa-solid fa-upload"></i>
                </button>
                <input type="file" id="importInput" class="hidden" accept=".json">

                <button id="themeToggleBtn" title="切換主題" class="p-2.5 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-800 rounded-xl transition-colors">
                    <i class="fa-solid fa-sun dark:hidden text-amber-500"></i>
                    <i class="fa-solid fa-moon hidden dark:block text-indigo-400"></i>
                </button>
            </div>
        </header>

        <!-- Add Task Card -->
        <div class="bg-white dark:bg-slate-800 rounded-2xl p-4 md:p-6 shadow-xl shadow-slate-200/50 dark:shadow-none border border-slate-200/80 dark:border-slate-700/60 mb-6 transition-all">
            <form id="todoForm" class="space-y-4">
                <div class="flex gap-2">
                    <input 
                        type="text" 
                        id="todoInput" 
                        placeholder="新增待辦事項... (例如：準備明天簡報)" 
                        required
                        class="flex-1 bg-slate-50 dark:bg-slate-900/80 border border-slate-300 dark:border-slate-700 focus:border-sky-500 dark:focus:border-sky-500 text-slate-900 dark:text-white rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-sky-500/20 transition-all text-base placeholder-slate-400"
                    />
                    <button 
                        type="submit" 
                        class="bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-600 hover:to-blue-700 text-white font-medium px-6 py-3 rounded-xl shadow-lg shadow-sky-500/25 active:scale-[0.98] transition-all flex items-center gap-2 whitespace-nowrap"
                    >
                        <i class="fa-solid fa-plus"></i>
                        <span class="hidden sm:inline">新增</span>
                    </button>
                </div>

                <!-- Advanced Options -->
                <div class="flex flex-wrap gap-3 items-center text-sm">
                    <!-- Priority -->
                    <div class="flex items-center gap-1.5 bg-slate-100 dark:bg-slate-900/60 px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700">
                        <i class="fa-solid fa-flag text-xs text-slate-400"></i>
                        <span class="text-xs text-slate-500 dark:text-slate-400">優先級：</span>
                        <select id="prioritySelect" class="bg-transparent text-slate-700 dark:text-slate-200 font-medium focus:outline-none cursor-pointer">
                            <option value="low" class="dark:bg-slate-800">普通 🟢</option>
                            <option value="medium" selected class="dark:bg-slate-800">重要 🟡</option>
                            <option value="high" class="dark:bg-slate-800">緊急 🔴</option>
                        </select>
                    </div>

                    <!-- Category -->
                    <div class="flex items-center gap-1.5 bg-slate-100 dark:bg-slate-900/60 px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700">
                        <i class="fa-solid fa-tag text-xs text-slate-400"></i>
                        <span class="text-xs text-slate-500 dark:text-slate-400">分類：</span>
                        <select id="categorySelect" class="bg-transparent text-slate-700 dark:text-slate-200 font-medium focus:outline-none cursor-pointer">
                            <option value="預設" class="dark:bg-slate-800">預設</option>
                            <option value="工作" class="dark:bg-slate-800">💼 工作</option>
                            <option value="個人" class="dark:bg-slate-800">👤 個人</option>
                            <option value="學習" class="dark:bg-slate-800">📚 學習</option>
                            <option value="購物" class="dark:bg-slate-800">🛒 購物</option>
                        </select>
                    </div>

                    <!-- Due Date -->
                    <div class="flex items-center gap-1.5 bg-slate-100 dark:bg-slate-900/60 px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700">
                        <i class="fa-regular fa-calendar text-xs text-slate-400"></i>
                        <span class="text-xs text-slate-500 dark:text-slate-400">截止日期：</span>
                        <input type="date" id="dueDateInput" class="bg-transparent text-slate-700 dark:text-slate-200 font-medium focus:outline-none cursor-pointer">
                    </div>
                </div>
            </form>
        </div>

        <!-- Progress Bar & Quick Stats Card -->
        <div class="bg-white dark:bg-slate-800 rounded-2xl p-4 shadow-xl shadow-slate-200/50 dark:shadow-none border border-slate-200/80 dark:border-slate-700/60 mb-6">
            <div class="flex justify-between items-center mb-2 text-sm font-medium">
                <span class="text-slate-600 dark:text-slate-300 flex items-center gap-2">
                    <i class="fa-solid fa-chart-pie text-sky-500"></i> 完成進度
                </span>
                <span id="progressText" class="text-sky-600 dark:text-sky-400 font-bold">0 / 0 (0%)</span>
            </div>
            <div class="w-full bg-slate-200 dark:bg-slate-700 h-2.5 rounded-full overflow-hidden">
                <div id="progressBar" class="bg-gradient-to-r from-sky-500 to-emerald-500 h-full w-0 transition-all duration-500 ease-out"></div>
            </div>
        </div>

        <!-- Controls & Filters Header -->
        <div class="flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-4 mb-4">
            <!-- Filter Tabs -->
            <div class="flex bg-slate-200/80 dark:bg-slate-800 p-1 rounded-xl text-sm font-medium self-start">
                <button data-filter="all" class="filter-tab px-4 py-1.5 rounded-lg text-slate-700 dark:text-slate-300 transition-all active-tab shadow-sm bg-white dark:bg-slate-700 text-sky-600 dark:text-sky-400">
                    全部 <span id="countAll" class="ml-1 text-xs px-1.5 py-0.5 rounded-full bg-slate-100 dark:bg-slate-600">0</span>
                </button>
                <button data-filter="active" class="filter-tab px-4 py-1.5 rounded-lg text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all">
                    進行中 <span id="countActive" class="ml-1 text-xs px-1.5 py-0.5 rounded-full bg-slate-100 dark:bg-slate-600">0</span>
                </button>
                <button data-filter="completed" class="filter-tab px-4 py-1.5 rounded-lg text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all">
                    已完成 <span id="countCompleted" class="ml-1 text-xs px-1.5 py-0.5 rounded-full bg-slate-100 dark:bg-slate-600">0</span>
                </button>
            </div>

            <!-- Search & Actions -->
            <div class="flex items-center gap-2">
                <div class="relative flex-1 sm:w-48">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="搜尋事項..." 
                        class="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 pl-8 pr-3 py-1.5 text-sm rounded-xl focus:outline-none focus:border-sky-500 dark:text-white"
                    />
                </div>
                <button id="clearCompletedBtn" class="text-xs text-rose-500 hover:text-rose-600 dark:hover:text-rose-400 px-3 py-2 border border-rose-200 dark:border-rose-900/50 hover:bg-rose-50 dark:hover:bg-rose-950/30 rounded-xl transition-all whitespace-nowrap">
                    <i class="fa-regular fa-trash-can mr-1"></i> 清除已完成
                </button>
            </div>
        </div>

        <!-- Todo List -->
        <div id="todoList" class="space-y-3 min-h-[180px]">
            <!-- Items generated dynamically by JS -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden flex-col items-center justify-center py-12 text-center">
            <div class="w-16 h-16 bg-slate-200 dark:bg-slate-800 rounded-full flex items-center justify-center text-slate-400 dark:text-slate-500 text-2xl mb-3">
                <i class="fa-regular fa-clipboard"></i>
            </div>
            <p class="text-slate-500 dark:text-slate-400 font-medium">尚無待辦事項</p>
            <p class="text-xs text-slate-400 dark:text-slate-500 mt-1">在上方輸入框新增您的第一個任務吧！</p>
        </div>
    </div>

    <!-- Edit Task Modal -->
    <div id="editModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-700 animate-slide-in">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-slate-900 dark:text-white">編輯待辦事項</h3>
                <button id="closeModalBtn" class="text-slate-400 hover:text-slate-600 dark:hover:text-white">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <form id="editForm" class="space-y-4">
                <input type="hidden" id="editTodoId">
                <div>
                    <label class="block text-xs text-slate-500 dark:text-slate-400 mb-1">內容</label>
                    <input type="text" id="editInput" required class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2.5 dark:text-white focus:outline-none focus:border-sky-500">
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                        <label class="block text-xs text-slate-500 dark:text-slate-400 mb-1">優先級</label>
                        <select id="editPriority" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 dark:text-white focus:outline-none">
                            <option value="low">普通 🟢</option>
                            <option value="medium">重要 🟡</option>
                            <option value="high">緊急 🔴</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-500 dark:text-slate-400 mb-1">分類</label>
                        <select id="editCategory" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 dark:text-white focus:outline-none">
                            <option value="預設">預設</option>
                            <option value="工作">💼 工作</option>
                            <option value="個人">👤 個人</option>
                            <option value="學習">📚 學習</option>
                            <option value="購物">🛒 購物</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-500 dark:text-slate-400 mb-1">截止日期</label>
                        <input type="date" id="editDueDate" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 dark:text-white focus:outline-none">
                    </div>
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" id="cancelEditBtn" class="px-4 py-2 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl text-sm font-medium">取消</button>
                    <button type="submit" class="px-4 py-2 bg-sky-500 hover:bg-sky-600 text-white rounded-xl text-sm font-medium shadow-md shadow-sky-500/20">儲存更新</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Notification Toast Container -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script>
        // --- State Variables ---
        let todos = [];
        let currentFilter = 'all';
        let searchQuery = '';

        // Storage Key Constants
        const LOCAL_STORAGE_KEY = 'taskflow_todos_v1';
        const THEME_STORAGE_KEY = 'taskflow_theme';

        // --- DOM Elements ---
        const todoForm = document.getElementById('todoForm');
        const todoInput = document.getElementById('todoInput');
        const prioritySelect = document.getElementById('prioritySelect');
        const categorySelect = document.getElementById('categorySelect');
        const dueDateInput = document.getElementById('dueDateInput');
        const todoList = document.getElementById('todoList');
        const emptyState = document.getElementById('emptyState');
        const searchInput = document.getElementById('searchInput');
        const clearCompletedBtn = document.getElementById('clearCompletedBtn');
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const exportBtn = document.getElementById('exportBtn');
        const importBtn = document.getElementById('importBtn');
        const importInput = document.getElementById('importInput');
        const currentDateText = document.getElementById('currentDateText');

        // Edit Modal DOM
        const editModal = document.getElementById('editModal');
        const editForm = document.getElementById('editForm');
        const editTodoId = document.getElementById('editTodoId');
        const editInput = document.getElementById('editInput');
        const editPriority = document.getElementById('editPriority');
        const editCategory = document.getElementById('editCategory');
        const editDueDate = document.getElementById('editDueDate');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const cancelEditBtn = document.getElementById('cancelEditBtn');

        // Stats DOM
        const countAll = document.getElementById('countAll');
        const countActive = document.getElementById('countActive');
        const countCompleted = document.getElementById('countCompleted');
        const progressText = document.getElementById('progressText');
        const progressBar = document.getElementById('progressBar');

        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            initDate();
            initTheme();
            loadTodos();
            renderTodos();
        });

        function initDate() {
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            currentDateText.textContent = new Date().toLocaleDateString('zh-TW', options);
        }

        // --- LocalStorage Handlers ---
        function loadTodos() {
            try {
                const stored = localStorage.getItem(LOCAL_STORAGE_KEY);
                if (stored) {
                    todos = JSON.parse(stored);
                } else {
                    todos = [];
                    saveTodos();
                }
            } catch (e) {
                console.error("無法讀取 LocalStorage:", e);
                todos = [];
            }
        }

        function saveTodos() {
            try {
                localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(todos));
            } catch (e) {
                showToast('儲存失敗：LocalStorage 可能已滿', 'error');
            }
        }

        // --- Todo Operations ---
        function addTodo(title, priority, category, dueDate) {
            const newTodo = {
                id: Date.now().toString(),
                title: title.trim(),
                completed: false,
                priority: priority || 'medium',
                category: category || '預設',
                dueDate: dueDate || '',
                createdAt: new Date().toISOString()
            };

            todos.unshift(newTodo);
            saveTodos();
            renderTodos();
            showToast('已新增事項', 'success');
        }

        function toggleTodo(id) {
            const todo = todos.find(t => t.id === id);
            if (todo) {
                todo.completed = !todo.completed;
                saveTodos();
                renderTodos();

                if (todo.completed) {
                    // Check if all completed for celebration!
                    if (todos.length > 0 && todos.every(t => t.completed)) {
                        triggerConfetti();
                        showToast('太棒了！所有任務皆已完成 🎉', 'success');
                    }
                }
            }
        }

        function deleteTodo(id) {
            todos = todos.filter(t => t.id !== id);
            saveTodos();
            renderTodos();
            showToast('已刪除事項', 'info');
        }

        function openEditModal(id) {
            const todo = todos.find(t => t.id === id);
            if (!todo) return;

            editTodoId.value = todo.id;
            editInput.value = todo.title;
            editPriority.value = todo.priority;
            editCategory.value = todo.category;
            editDueDate.value = todo.dueDate;

            editModal.classList.remove('hidden');
            editModal.classList.add('flex');
            editInput.focus();
        }

        function closeEditModal() {
            editModal.classList.add('hidden');
            editModal.classList.remove('flex');
        }

        function updateTodo(id, newTitle, newPriority, newCategory, newDueDate) {
            const todo = todos.find(t => t.id === id);
            if (todo) {
                todo.title = newTitle.trim();
                todo.priority = newPriority;
                todo.category = newCategory;
                todo.dueDate = newDueDate;

                saveTodos();
                renderTodos();
                closeEditModal();
                showToast('已更新事項內容', 'success');
            }
        }

        function clearCompleted() {
            const completedCount = todos.filter(t => t.completed).length;
            if (completedCount === 0) {
                showToast('目前沒有已完成的事項', 'info');
                return;
            }

            todos = todos.filter(t => !t.completed);
            saveTodos();
            renderTodos();
            showToast(`已清理 ${completedCount} 項已完成任務`, 'success');
        }

        // --- Filters & Stats ---
        function getFilteredTodos() {
            return todos.filter(todo => {
                // Category/Status Filter
                const matchesFilter = 
                    currentFilter === 'all' ? true :
                    currentFilter === 'active' ? !todo.completed :
                    currentFilter === 'completed' ? todo.completed : true;

                // Search Query
                const matchesSearch = todo.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                      (todo.category && todo.category.toLowerCase().includes(searchQuery.toLowerCase()));

                return matchesFilter && matchesSearch;
            });
        }

        function updateStats() {
            const total = todos.length;
            const active = todos.filter(t => !t.completed).length;
            const completed = todos.filter(t => t.completed).length;
            const percentage = total === 0 ? 0 : Math.round((completed / total) * 100);

            countAll.textContent = total;
            countActive.textContent = active;
            countCompleted.textContent = completed;

            progressText.textContent = `${completed} / ${total} (${percentage}%)`;
            progressBar.style.width = `${percentage}%`;
        }

        // --- Rendering ---
        function renderTodos() {
            updateStats();
            const filteredTodos = getFilteredTodos();

            todoList.innerHTML = '';

            if (filteredTodos.length === 0) {
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
            } else {
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');

                filteredTodos.forEach(todo => {
                    const itemEl = createTodoElement(todo);
                    todoList.appendChild(itemEl);
                });
            }
        }

        function createTodoElement(todo) {
            const div = document.createElement('div');
            div.className = `group bg-white dark:bg-slate-800 rounded-xl p-4 shadow-sm border border-slate-200/80 dark:border-slate-700/60 hover:shadow-md transition-all-200 animate-slide-in flex items-center justify-between gap-3 ${todo.completed ? 'bg-slate-50/70 dark:bg-slate-800/50' : ''}`;

            // Priority Indicator Color
            let priorityBadge = '';
            if (todo.priority === 'high') {
                priorityBadge = `<span class="text-[11px] px-2 py-0.5 rounded-full bg-rose-100 text-rose-600 dark:bg-rose-950/60 dark:text-rose-400 font-semibold">緊急</span>`;
            } else if (todo.priority === 'medium') {
                priorityBadge = `<span class="text-[11px] px-2 py-0.5 rounded-full bg-amber-100 text-amber-700 dark:bg-amber-950/60 dark:text-amber-400 font-semibold">重要</span>`;
            } else {
                priorityBadge = `<span class="text-[11px] px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 dark:bg-slate-700 dark:text-slate-300">普通</span>`;
            }

            // Category Badge
            const categoryBadge = todo.category ? `<span class="text-[11px] px-2 py-0.5 rounded-full bg-sky-50 text-sky-600 dark:bg-sky-950/60 dark:text-sky-400 font-medium">${escapeHtml(todo.category)}</span>` : '';

            // Due Date formatting
            let dueDateText = '';
            if (todo.dueDate) {
                const today = new Date().toISOString().split('T')[0];
                const isOverdue = todo.dueDate < today && !todo.completed;
                dueDateText = `
                    <span class="text-xs flex items-center gap-1 ${isOverdue ? 'text-rose-500 font-semibold' : 'text-slate-400 dark:text-slate-500'}">
                        <i class="fa-regular fa-clock text-[10px]"></i> ${todo.dueDate} ${isOverdue ? '(逾期)' : ''}
                    </span>
                `;
            }

            div.innerHTML = `
                <div class="flex items-center gap-3.5 flex-1 min-w-0">
                    <!-- Checkbox -->
                    <button type="button" onclick="toggleTodo('${todo.id}')" class="w-6 h-6 rounded-lg border-2 ${todo.completed ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300 dark:border-slate-600 hover:border-sky-500'} flex items-center justify-center transition-all flex-shrink-0">
                        ${todo.completed ? '<i class="fa-solid fa-check text-xs"></i>' : ''}
                    </button>

                    <!-- Content -->
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2 flex-wrap mb-1">
                            ${priorityBadge}
                            ${categoryBadge}
                            ${dueDateText}
                        </div>
                        <p class="text-base font-medium ${todo.completed ? 'line-through text-slate-400 dark:text-slate-500' : 'text-slate-800 dark:text-slate-100'} break-words">
                            ${escapeHtml(todo.title)}
                        </p>
                    </div>
                </div>

                <!-- Actions -->
                <div class="flex items-center gap-1 opacity-90 sm:opacity-0 group-hover:opacity-100 transition-opacity">
                    <button onclick="openEditModal('${todo.id}')" title="編輯" class="p-2 text-slate-400 hover:text-sky-500 hover:bg-slate-100 dark:hover:bg-slate-700/60 rounded-lg transition-colors">
                        <i class="fa-regular fa-pen-to-square"></i>
                    </button>
                    <button onclick="deleteTodo('${todo.id}')" title="刪除" class="p-2 text-slate-400 hover:text-rose-500 hover:bg-slate-100 dark:hover:bg-slate-700/60 rounded-lg transition-colors">
                        <i class="fa-regular fa-trash-can"></i>
                    </button>
                </div>
            `;

            return div;
        }

        // --- Event Listeners ---
        todoForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const title = todoInput.value;
            const priority = prioritySelect.value;
            const category = categorySelect.value;
            const dueDate = dueDateInput.value;

            if (title.trim()) {
                addTodo(title, priority, category, dueDate);
                todoInput.value = '';
                dueDateInput.value = '';
                todoInput.focus();
            }
        });

        // Filter Tabs Handling
        document.querySelectorAll('.filter-tab').forEach(tab => {
            tab.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-tab').forEach(t => {
                    t.classList.remove('bg-white', 'dark:bg-slate-700', 'text-sky-600', 'dark:text-sky-400', 'shadow-sm');
                    t.classList.add('text-slate-600', 'dark:text-slate-400');
                });

                const target = e.currentTarget;
                target.classList.add('bg-white', 'dark:bg-slate-700', 'text-sky-600', 'dark:text-sky-400', 'shadow-sm');
                target.classList.remove('text-slate-600', 'dark:text-slate-400');

                currentFilter = target.getAttribute('data-filter');
                renderTodos();
            });
        });

        // Search Input
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderTodos();
        });

        // Clear Completed
        clearCompletedBtn.addEventListener('click', clearCompleted);

        // Edit Modal Listeners
        closeModalBtn.addEventListener('click', closeEditModal);
        cancelEditBtn.addEventListener('click', closeEditModal);
        editForm.addEventListener('submit', (e) => {
            e.preventDefault();
            updateTodo(
                editTodoId.value,
                editInput.value,
                editPriority.value,
                editCategory.value,
                editDueDate.value
            );
        });

        // Theme Switcher
        function initTheme() {
            const savedTheme = localStorage.getItem(THEME_STORAGE_KEY);
            if (savedTheme === 'light') {
                document.documentElement.classList.remove('dark');
            } else {
                document.documentElement.classList.add('dark');
            }
        }

        themeToggleBtn.addEventListener('click', () => {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem(THEME_STORAGE_KEY, isDark ? 'dark' : 'light');
            showToast(`已切換為${isDark ? '深色' : '淺色'}模式`, 'info');
        });

        // Export JSON
        exportBtn.addEventListener('click', () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(todos, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `taskflow_backup_${new Date().toISOString().split('T')[0]}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast('資料備份已匯出', 'success');
        });

        // Import JSON
        importBtn.addEventListener('click', () => importInput.click());
        importInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const imported = JSON.parse(evt.target.result);
                    if (Array.isArray(imported)) {
                        todos = imported;
                        saveTodos();
                        renderTodos();
                        showToast('成功匯入待辦清單！', 'success');
                    } else {
                        throw new Error('格式不符');
                    }
                } catch (err) {
                    showToast('匯入失敗：請確認 JSON 檔案格式正確', 'error');
                }
            };
            reader.readAsText(file);
            importInput.value = '';
        });

        // --- Toast Notification Helper ---
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');

            let colors = 'bg-slate-800 text-white dark:bg-slate-100 dark:text-slate-900';
            let icon = 'fa-circle-info';

            if (type === 'success') {
                colors = 'bg-emerald-600 text-white';
                icon = 'fa-circle-check';
            } else if (type === 'error') {
                colors = 'bg-rose-600 text-white';
                icon = 'fa-circle-exclamation';
            }

            toast.className = `pointer-events-auto px-4 py-2.5 rounded-xl shadow-lg font-medium text-sm flex items-center gap-2.5 animate-slide-in ${colors} transition-all duration-300`;
            toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span>${escapeHtml(message)}</span>`;

            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(10px)';
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        // Confetti celebration
        function triggerConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 80,
                    spread: 60,
                    origin: { y: 0.8 }
                });
            }
        }

        // HTML Escaper (XSS Protection)
        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
